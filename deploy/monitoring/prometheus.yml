global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yaml

scrape_configs:
  - job_name: orch-server
    static_configs:
      - targets:
          - orch-server:8080

  - job_name: orch-agent
    static_configs:
      - targets:
          - orch-agent:8081

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
