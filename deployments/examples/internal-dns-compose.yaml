services:
  orch-server:
    image: orch-server:dev
    environment:
      ORCH_DNS_ADDR: 0.0.0.0:53
    ports:
      - "8053:53/udp"
    networks:
      default:
        ipv4_address: 172.28.0.2
  client:
    image: busybox:1.36
    command: ["sh", "-c", "nslookup api.default.svc.orch; sleep 3600"]
    dns:
      - 172.28.0.2
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
