openapi: 3.0.3
info:
  title: orch API
  version: v1
  description: Public user-facing API for the orch control plane. Workload APIs use the optional X-Orch-Namespace header and default to `default`.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Server is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/version:
    get:
      summary: Get stable API version metadata
      responses:
        "200":
          description: API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIVersionResponse"
  /v1/namespaces:
    get:
      summary: List namespaces
      responses:
        "200":
          description: Namespace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNamespacesResponse"
    post:
      summary: Create namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "201":
          description: Created namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResponse"
  /v1/namespaces/{name}:
    delete:
      summary: Delete an empty namespace
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Namespace deleted
  /v1/quota:
    get:
      summary: Get namespace quota and usage
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Quota and current usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceQuotaResponse"
    put:
      summary: Set namespace quota
      parameters:
        - $ref: "#/components/parameters/Namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceQuota"
      responses:
        "200":
          description: Updated quota and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceQuotaResponse"
        "409":
          description: Existing usage exceeds the requested quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/gitops/sources:
    get:
      summary: List namespace GitOps sources
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: GitOps sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGitOpsSourcesResponse"
    post:
      summary: Create a GitOps source
      parameters:
        - $ref: "#/components/parameters/Namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitOpsSourceRequest"
      responses:
        "201":
          description: Created GitOps source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitOpsSourceResponse"
  /v1/gitops/sources/{id}:
    delete:
      summary: Delete a GitOps source
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Namespace"
      responses:
        "204":
          description: GitOps source deleted
  /v1/gitops/sources/{id}/sync:
    post:
      summary: Synchronize a GitOps source now
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: Synchronized GitOps source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitOpsSourceResponse"
  /v1/gitops/status:
    get:
      summary: List GitOps drift status
      responses: {"200": {description: Drift status}}
  /v1/gitops/diff/{service}:
    get:
      summary: Diff live and Git desired service
      parameters:
        - {name: service, in: path, required: true, schema: {type: string}}
      responses: {"200": {description: Service diff}}
  /v1/jobs:
    get:
      summary: List jobs
      responses: {"200": {description: Jobs}}
    post:
      summary: Run a one-shot job
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: Job created}}
  /v1/jobs/{id}:
    get:
      summary: Get job
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Job}}
    delete:
      summary: Delete job
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"204": {description: Job deleted}}
  /v1/cronjobs:
    get:
      summary: List cron jobs
      responses: {"200": {description: Cron jobs}}
    post:
      summary: Apply cron job
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: Cron job created}}
  /v1/cronjobs/{id}:
    get:
      summary: Get cron job
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Cron job}}
    delete:
      summary: Delete cron job
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"204": {description: Cron job deleted}}
  /v1/cronjobs/{id}/suspend:
    post:
      summary: Suspend cron job
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Cron job suspended}}
  /v1/cronjobs/{id}/resume:
    post:
      summary: Resume cron job
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Cron job resumed}}
  /v1/volumes:
    get:
      summary: List volumes
      responses: {"200": {description: Volumes}}
    post:
      summary: Create local volume
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: Volume created}}
  /v1/volumes/{id}:
    get:
      summary: Get volume
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Volume}}
    delete:
      summary: Delete volume
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"204": {description: Volume deleted}}
  /v1/volume-claims:
    get:
      summary: List volume claims
      responses: {"200": {description: Volume claims}}
    post:
      summary: Create volume claim
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: Volume claim created}}
  /v1/notification-sinks:
    get:
      summary: List notification sinks
      responses: {"200": {description: Notification sinks}}
    post:
      summary: Create notification sink
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"201": {description: Notification sink created}}
  /v1/notification-sinks/{id}:
    delete:
      summary: Delete notification sink
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"204": {description: Notification sink deleted}}
  /v1/notification-sinks/{id}/test:
    post:
      summary: Test notification sink
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Test delivered}}
  /v1/nodes:
    get:
      summary: List nodes
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNodesResponse"
  /v1/nodes/{id}:
    get:
      summary: Get node
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
  /v1/nodes/{id}/drain:
    post:
      summary: Drain node
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Force"
      responses:
        "200":
          description: Drained node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
  /v1/nodes/{id}/uncordon:
    post:
      summary: Uncordon node
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Ready node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
  /v1/nodes/{id}/drain-status:
    get:
      summary: Get node drain status
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Drain status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDrainStatusResponse"
  /v1/services:
    post:
      summary: Create service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
    get:
      summary: List services
      responses:
        "200":
          description: Service list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResponse"
  /v1/services/{id}:
    get:
      summary: Get service
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
    delete:
      summary: Delete service
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Service deletion requested
  /v1/services/{id}/scale:
    post:
      summary: Scale service
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Force"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleServiceRequest"
      responses:
        "200":
          description: Scaled service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
  /v1/services/{id}/rollout:
    post:
      summary: Start service rollout
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Force"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolloutServiceRequest"
      responses:
        "202":
          description: Rollout accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
    get:
      summary: Get latest service rollout
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Latest deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
  /v1/services/{id}/rollback:
    post:
      summary: Start service rollback
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Force"
      responses:
        "202":
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
  /v1/services/{id}/endpoints:
    get:
      summary: Get service discovery endpoints
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: include_unhealthy
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Service endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEndpointsResponse"
  /v1/rollouts/{id}:
    get:
      summary: Get rollout by ID
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
  /v1/tasks:
    get:
      summary: List tasks
      parameters:
        - name: service_id
          in: query
          schema:
            type: string
        - name: node_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTasksResponse"
  /v1/tasks/{id}:
    get:
      summary: Get task
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /v1/events:
    get:
      summary: List events
      parameters:
        - name: service_id
          in: query
          schema:
            type: string
        - name: task_id
          in: query
          schema:
            type: string
        - name: node_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
  /v1/logs:
    get:
      summary: Stream task logs
      parameters:
        - name: task_id
          in: query
          schema:
            type: string
        - name: service_id
          in: query
          schema:
            type: string
        - name: follow
          in: query
          schema:
            type: boolean
        - name: tail
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Log stream
          content:
            text/plain:
              schema:
                type: string
  /v1/secrets:
    post:
      summary: Create secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          description: Secret metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
    get:
      summary: List secrets
      responses:
        "200":
          description: Secret list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecretsResponse"
  /v1/secrets/{name}:
    get:
      summary: Get secret metadata
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
    delete:
      summary: Delete secret
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Secret deleted
  /v1/registry-credentials:
    post:
      summary: Create registry credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistryCredentialRequest"
      responses:
        "201":
          description: Registry credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryCredentialResponse"
    get:
      summary: List registry credentials
      responses:
        "200":
          description: Registry credential list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRegistryCredentialsResponse"
  /v1/registry-credentials/{id}:
    delete:
      summary: Delete registry credential
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Registry credential deleted
  /v1/audit:
    get:
      summary: List audit logs
      parameters:
        - name: actor_type
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditLogsResponse"
  /v1/maintenance-windows:
    get:
      summary: List maintenance windows visible to the selected namespace
      responses:
        "200":
          description: Maintenance windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindowsResponse"
    post:
      summary: Create a namespace or global maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindow"
      responses:
        "201":
          description: Created maintenance window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindowResponse"
  /v1/maintenance-windows/{id}:
    delete:
      summary: Delete a maintenance window
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Maintenance window deleted
  /v1/retention:
    get:
      summary: Get retention configuration and last pruning result
      responses:
        "200":
          description: Retention status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionStatus"
  /v1/retention/prune:
    post:
      summary: Run retention pruning
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Pruning result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PruneResult"
  /v1/usage:
    get:
      summary: Export periodic usage snapshots for a namespace
      parameters:
        - name: namespace
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReport"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Namespace:
      name: X-Orch-Namespace
      in: header
      required: false
      description: Workload namespace; defaults to `default`.
      schema:
        type: string
        default: default
    Force:
      name: force
      in: query
      required: false
      description: Audit and bypass an applicable maintenance-window restriction.
      schema:
        type: boolean
        default: false
  schemas:
    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time
    APIVersionResponse:
      type: object
      required: [api_version, server_version, minimum_agent_version, maximum_tested_agent_version, database_schema_version, minimum_schema_version, maximum_schema_version]
      properties:
        api_version:
          type: string
          enum: [v1]
        server_version:
          type: string
          example: 0.3.0
        minimum_agent_version:
          type: string
        maximum_tested_agent_version:
          type: string
        database_schema_version:
          type: integer
        minimum_schema_version:
          type: integer
        maximum_schema_version:
          type: integer
    Namespace:
      type: object
      required: [name, created_at]
      properties:
        name:
          type: string
        created_at:
          type: string
          format: date-time
    CreateNamespaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    NamespaceResponse:
      type: object
      properties:
        namespace:
          $ref: "#/components/schemas/Namespace"
    ListNamespacesResponse:
      type: object
      properties:
        namespaces:
          type: array
          items:
            $ref: "#/components/schemas/Namespace"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/RequestError"
    RequestError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [not_found, invalid_argument, conflict, quota_exceeded, unauthorized, forbidden, failed_precondition, unavailable, internal]
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ResourceQuantity:
      type: object
      properties:
        cpu:
          type: integer
          format: int64
        memory:
          type: integer
          format: int64
    ResourceRequirements:
      type: object
      properties:
        requests:
          $ref: "#/components/schemas/ResourceQuantity"
        limits:
          $ref: "#/components/schemas/ResourceQuantity"
    ResourceQuota:
      type: object
      properties:
        namespace:
          type: string
        max_services:
          type: integer
        max_replicas:
          type: integer
        max_cpu_millicores:
          type: integer
          format: int64
        max_memory_bytes:
          type: integer
          format: int64
        max_public_ports:
          type: integer
        max_secrets:
          type: integer
        max_registry_credentials:
          type: integer
        updated_at:
          type: string
          format: date-time
    ResourceUsage:
      type: object
      properties:
        services: {type: integer}
        replicas: {type: integer}
        cpu_millicores: {type: integer, format: int64}
        memory_bytes: {type: integer, format: int64}
        public_ports: {type: integer}
        secrets: {type: integer}
        registry_credentials: {type: integer}
    ResourceQuotaResponse:
      type: object
      properties:
        quota:
          $ref: "#/components/schemas/ResourceQuota"
        usage:
          $ref: "#/components/schemas/ResourceUsage"
    ImageMetadata:
      type: object
      properties:
        requested_image: {type: string}
        digest: {type: string}
        registry: {type: string}
        name: {type: string}
        tag: {type: string}
        pinned: {type: boolean}
    Port:
      type: object
      properties:
        name:
          type: string
        protocol:
          type: string
          enum: [tcp, udp]
        container_port:
          type: integer
        published_port:
          type: integer
    Healthcheck:
      type: object
      properties:
        type:
          type: string
          enum: [none, http, tcp]
        scheme:
          type: string
          enum: [http, https]
        path:
          type: string
        port:
          type: integer
        interval:
          type: integer
          format: int64
        timeout:
          type: integer
          format: int64
        healthy_threshold:
          type: integer
        unhealthy_threshold:
          type: integer
    RestartPolicy:
      type: object
      properties:
        condition:
          type: string
          enum: [never, on_failure, always]
        max_attempts:
          type: integer
    SecurityContext:
      type: object
      properties:
        user:
          type: string
        read_only_root_filesystem:
          type: boolean
        privileged:
          type: boolean
        cap_add:
          type: array
          items:
            type: string
        cap_drop:
          type: array
          items:
            type: string
        host_network:
          type: boolean
        host_pid:
          type: boolean
    AutoscalingPolicy:
      type: object
      properties:
        enabled:
          type: boolean
        min_replicas:
          type: integer
        max_replicas:
          type: integer
        target_cpu_utilization:
          type: integer
        cooldown:
          type: integer
          format: int64
        stabilization_window:
          type: integer
          format: int64
    ServiceSpec:
      type: object
      required: [name, image, replicas, resource_requirements]
      properties:
        name:
          type: string
        image:
          type: string
        image_metadata:
          $ref: "#/components/schemas/ImageMetadata"
        image_pull_secret:
          type: string
        stateful:
          type: boolean
        replicas:
          type: integer
        env:
          type: object
          additionalProperties:
            type: string
        secret_refs:
          type: array
          items:
