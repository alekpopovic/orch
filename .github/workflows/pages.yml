name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - api/openapi.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static docs artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          cp README.md CHANGELOG.md RELEASE_NOTES.md _site/
          cp api/openapi.yaml _site/openapi.yaml
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
